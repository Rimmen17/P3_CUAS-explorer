th and confidence threshold - test model using hands detection.\nMODEL = \"/app/models/handsModel.pt\"\nDEFAULT_CONFIDENCE = 0.8\n", "line": 1, "doc": {"summary": "Fælles indstillinger: kameraets adresse og login, billedstørrelse, styringsparametre og YOLO-model. Alle andre filer importerer herfra. Værdier for IP, bruger og password vises ikke på denne side.", "notes": "Filen er committet til git, så kameraets login ligger i repoets historik for alle med adgang. Overvej at flytte den til .gitignore (den er allerede i .dockerignore) og dele den på anden vis."}, "id": "ptz-code-credentials-py", "missing": false}, "ptz-dockerignore": {"key": "ptz/.dockerignore", "kind": "file", "name": ".dockerignore", "parent": "ptz", "children": [], "file": "ptz/.dockerignore", "size": 37, "text": true, "ext": ".dockerignore", "source": "credentials.py\nmodels/\n__pycache__/", "line": 1, "doc": {"summary": "Holder credentials.py, models/ og __pycache__ ude af Docker-imaget. De mountes i stedet ind via docker-compose."}, "id": "ptz-dockerignore", "missing": false}, "ptz-dockerfile": {"key": "ptz/Dockerfile", "kind": "file", "name": "Dockerfile", "parent": "ptz", "children": [], "file": "ptz/Dockerfile", "size": 340, "text": true, "ext": "Dockerfile", "source": "FROM pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime\n\nENV PYTHONUNBUFFERED=1\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*\n\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY . .\nCMD [\"python\", \"/app/code/main.py\"]", "line": 1, "doc": {"summary": "Bygger imaget på pytorch/pytorch:2.5.1-cuda12.4, installerer libgl1/libglib2.0 (kræves af OpenCV) og requirements.txt, og starter /app/code/main.py."}, "id": "ptz-dockerfile", "missing": false}, "ptz-code-controllerclass-py": {"key": "ptz/code/controllerClass.py", "kind": "file", "name": "controllerClass.py", "parent": "ptz-code", "children": ["ptz-code-controllerclass-py-commandptz"], "file": "ptz/code/controllerClass.py", "size": 2660, "text": true, "ext": ".py", "module_doc": null, "source": "import threading, time, requests \nfrom requests.auth import HTTPDigestAuth\nfrom credentials import CAMERA_IP, CAMERA_USER, CAMERA_PASSWORD\n\nclass commandPTZ(threading.Thread):\n    def __init__(self, get_target_func, autostart=True):\n        super().__init__(daemon=True)\n        self.get_target_func = get_target_func\n        self.session = requests.Session()\n        self.session.auth = HTTPDigestAuth(CAMERA_USER, CAMERA_PASSWORD)\n        self._lock = threading.Lock()\n        self.running = True\n        self.command = None\n        self.last_stamp = 0.0\n        self.last_time = time.time()  #Used for debug.\n        self.debug_time = time.time() #Used for debug.\n        if autostart:\n            self.start()\n\n    def run(self):\n        while self.running:\n            self.command, stamp = self.get_target_func()\n            if stamp == self.last_stamp:      #command == self.last_command, is already handled by the stamp, so no need to check both.\n                time.sleep(0.02)        #Put the trejactory calculation here, so when no new command is recieved \n                self._search()          #Here I search for the drone after during no information from the yolo detection, so the camera will keep moving in a search pattern until a new command is recieved.\n                continue\n            else:\n                self.last_stamp = stamp\n                self._send_command()\n                self.last_time = time.time()\n\n    \n    def _send_command(self):\n        url = f\"http://{CAMERA_IP}/axis-cgi/com/ptz.cgi?{self.command}\"\n        try:\n            response = self.session.get(url, timeout=0.5)\n            response.raise_for_status()\n            return response.text\n        except requests.exceptions.RequestException as e:\n            print(f\"PTZ send failed: {e}\")\n            return None\n    \n    def _search(self):\n        self.debug_time = time.time() - self.last_time\n        if self.debug_time > 1.0:\n            self.command = \"continuouspantiltmove=0,0\" #Stops the camera after 1 second of no detection.\n            self._send_command() #Stops the camera after 1 second of no detection.\n\n        if self.debug_time > 1.0: #Debug code for the search function.\n            self.debug_time = 0.0\n            self.last_time = time.time()\n            print(\"No new command recieved, searching..\") #The PTZ camera should search for drone. Here.\n\n    def stop(self):\n        self.running = False\n        self.command = \"continuouspantiltmove=0,0\"\n        self._send_command()  # Send a stop command to the camera\n        if self.is_alive():\n            self.join(timeout=3.0)", "line": 1, "doc": {"summary": "Sender kommandoer til kameraets PTZ-motor over HTTP."}, "id": "ptz-code-controllerclass-py", "missing": false}, "ptz-code-feedclass-py": {"key": "ptz/code/feedClass.py", "kind": "file", "name": "feedClass.py", "parent": "ptz-code", "children": ["ptz-code-feedclass-py-feedrtsp"], "file": "ptz/code/feedClass.py", "size": 2313, "text": true, "ext": ".py", "module_doc": null, "source": "import os\nos.environ[\"OPENCV_FFMPEG_CAPTURE_OPTIONS\"] = \"rtsp_transport;tcp\"\n\nimport threading, time, cv2\nfrom credentials import CAMERA_IP, CAMERA_USER, CAMERA_PASSWORD, FRAME_WIDTH, FRAME_HEIGHT\n\n# This class main function is to get the live feed through RTSP, creating a object of this auto starts run(), and starts the threading for class.\n# 1. Use the function self.read() to get the newest frame and its timestamp.\n# \"frame, stamp\" = \"(frame.shape, frame.dtype), stamp\"e.g. : \"((1080, 1920, 3), uint8), 0.01...10.32\"\n# uint8 holds the BGR farvene: which means every frame is the Size: 1080 × 1920 × 3 = 6,220,800 bytes, about 6.2 MB per frame.\n#--------------------------------------------self.read()--------------------------------------\nclass FeedRTSP(threading.Thread):\n    def __init__(self, ip=CAMERA_IP, user=CAMERA_USER, password=CAMERA_PASSWORD, resolution=f\"{FRAME_WIDTH}x{FRAME_HEIGHT}\", autostart=True):\n        super().__init__(daemon=True)\n        self.url = (f\"rtsp://{user}:{password}@{ip}\"\n                    f\"/axis-media/media.amp?videocodec=h264&resolution={resolution}\")\n        self.frame = None\n        self.stamp = 0.0\n        self.frames = 0\n        self.error = None\n        self.lock = threading.Lock()\n        self.running = True\n\n        if autostart:\n            self.start()\n\n    def run(self):\n        while self.running:\n            cap = cv2.VideoCapture(self.url, cv2.CAP_FFMPEG)\n            if not cap.isOpened():\n                self.error = \"Cant Open the Stream\"\n                cap.release()\n                time.sleep(2.0)\n                continue\n            self.error = None\n            while self.running:\n                ok, frame = cap.read()\n                if not ok:\n                    self.error = \"stream Interrupted\"\n                    break\n                with self.lock:\n                    self.frame = frame\n                    self.stamp = time.time()\n                    self.frames += 1\n            cap.release()\n\n    def read(self):\n        with self.lock:\n            if self.frame is None:\n                return None, 0.0\n            return self.frame.copy(), self.stamp\n\n    def stop(self):\n        self.running = False\n        if self.is_alive():\n            self.join(timeout=3.0)", "line": 1, "doc": {"summary": "Henter live-video fra kameraet i en baggrundstråd og holder altid det nyeste billede klar."}, "id": "ptz-code-feedclass-py", "missing": false}, "ptz-code-guiclass-py": {"key": "ptz/code/guiClass.py", "kind": "file", "name": "guiClass.py", "parent": "ptz-code", "children": ["ptz-code-guiclass-py-guiserver", "ptz-code-guiclass-py-main"], "file": "ptz/code/guiClass.py", "size": 3235, "text": true, "ext": ".py", "module_doc": null, "source": "import os, threading\nfrom recorderClass import Recorder\nfrom flask import Flask, jsonify, send_from_directory\nfrom werkzeug.serving import make_server\n\n\nclass GUIServer(threading.Thread):\n        \n    def __init__(self, feed=None, yolo=None, target=None, folder=\"/app/recordings\", port=8080, autostart=True):\n        super().__init__(daemon=True)\n        self.feed, self.yolo, self.target = feed, yolo, target\n        self.folder = folder\n        self.rec = None             # the running Recorder, or None\n        self.manual = False\n        self.stops = 0\n        self._lock = threading.Lock()\n\n        here = os.path.dirname(os.path.abspath(__file__))\n        self.app = Flask(__name__, static_folder=os.path.join(here, \"static\"))\n        self._routes()\n        self.server = make_server(\"•••\", port, self.app, threaded=True)\n        if autostart:\n            self.start()\n\n    def _routes(self):\n        app = self.app\n        \n        @app.route(\"/\")\n        def page_index():\n            return send_from_directory(app.static_folder, \"index.html\")\n\n        @app.route(\"/state\")\n        def state():\n            return jsonify(self.state())\n\n        @app.route(\"/record\", methods=[\"POST\"])\n        def record():\n            if self.feed is None:\n                return jsonify({**self.state(), \"error\": \"no camera feed - start the GUI from main.py\"}), 503\n            with self._lock:\n                old, self.rec = self.rec, None\n                if old is None:\n                    self.rec = Recorder(self.feed, self.yolo, self.target, folder=self.folder)\n            if old is not None:\n                old.stop()          # outside the lock: stop() can take up to 3 s\n            print(\"GUI: recording\", self.rec is not None)\n            return jsonify(self.state())\n\n        @app.route(\"/manual\", methods=[\"POST\"])\n        def manual():\n            with self._lock:\n                self.manual = not self.manual\n            print(\"GUI: manual\", self.manual)\n            return jsonify(self.state())\n        \n        @app.route(\"/stop\", methods=[\"POST\"])\n        def stop():\n            with self._lock:\n                self.stops += 1\n            print(\"GUI: stop camera\")\n            return jsonify(self.state())\n\n    def state(self):\n        with self._lock:\n            return {\n                \"recording\": self.rec is not None,\n                \"file\": os.path.basename(self.rec.video_path) if self.rec else None,\n                \"manual\": self.manual,\n                \"stops\": self.stops,\n            }\n    \n    def run(self):\n        self.server.serve_forever()\n\n    def stop(self):\n        with self._lock:\n            old, self.rec = self.rec, None\n        if old is not None:\n            old.stop()              # close a running recording before the program ends\n        self.server.shutdown()\n        if self.is_alive():\n            self.join(timeout=3.0)\n\nif __name__ == \"__main__\":\n    import time\n    gui = GUIServer()\n    print(\"GUI on http://localhost:8080 - Press Ctrl+C to stop\")\n    try:\n        while True:\n            time.sleep(1)\n    except KeyboardInterrupt:\n        pass\n    finally:\n        gui.stop()", "line": 1, "doc": {"summary": "Flask-webserver på port 8080 med knapper til optagelse, auto/manuel og stop."}, "id": "ptz-code-guiclass-py", "missing": false}, "ptz-code-main-py": {"key": "ptz/code/main.py", "kind": "file", "name": "main.py", "parent": "ptz-code", "children": ["ptz-code-main-py-main", "ptz-code-main-py-main-2"], "file": "ptz/code/main.py", "size": 1891, "text": true, "ext": ".py", "module_doc": null, "source": "import time\n\n#Feedclass, yoloClass, targetClass, controllerClass - all !threaded! except for targetClass.\nfrom feedClass import FeedRTSP\nfrom yoloClass import DetectionModel\nfrom targetClass import TargetCalculator\nfrom controllerClass import commandPTZ \nfrom guiClass import GUIServer\n\n\n\ndef main():\n    RTSP = FeedRTSP()\n    YOLO = DetectionModel(RTSP)                 # pass the feed object itself: maybe need a \"(RTSP, None)\" just removed\n    TARGET = TargetCalculator()\n    CONTROLLER = commandPTZ(TARGET.get_target)  #Maybe need TARGET.update() somewhere; see targetClass.py, but not sure where to put it. Maybe in the yoloClass.py after every detection, but then I need to pass the stamp and the 2 cornors of the boundary box to the targetClass.py.\n                                                #Also TARGET.get_target() returns both command and time stamp. \"command\", self._history[-1][2]\n    GUI = GUIServer(feed=RTSP, yolo=YOLO, target=TARGET)\n    try:\n        last_id = None\n        while True:\n            box_info = YOLO.get_detection()                           # newest result, never blocks\n            position, det_id, time_stamp = box_info[0], box_info[1], box_info[2]  # maybe not needed cant figure.\n\n            if det_id != last_id:\n                last_id = det_id\n                if position is None:\n                    TARGET.target_lost() \n\n                else:\n                    x1, y1, x2, y2 = position\n                    TARGET.calculate_command(x1, y1, x2, y2, det_id, time_stamp)\n                    last_id = det_id\n\n            time.sleep(0.01)                                                          # don't spin at 100% CPU\n    except KeyboardInterrupt:\n        pass\n    finally:\n        GUI.stop()\n        CONTROLLER.stop()\n        YOLO.stop()\n        RTSP.stop()\n\nif __name__ == \"__main__\":\n    main()", "line": 1, "doc": {"summary": "Startpunktet. Opretter alle objekter og kører løkken, der sender nye YOLO-resultater videre til TargetCalculator."}, "id": "ptz-code-main-py", "missing": false}, "ptz-code-recorderclass-py": {"key": "ptz/code/recorderClass.py", "kind": "file", "name": "recorderClass.py", "parent": "ptz-code", "children": ["ptz-code-recorderclass-py-recorder"], "file": "ptz/code/recorderClass.py", "size": 2841, "text": true, "ext": ".py", "module_doc": null, "source": "import os, json, threading, time, cv2\n\n\nclass Recorder(threading.Thread):\n    def __init__(self, feed, yolo, target, folder=\"/app/recordings\", fps=25, autostart=True):\n        super().__init__(daemon=True)\n        self.feed, self.yolo, self.target = feed, yolo, target\n        self.folder, self.fps = folder, fps\n        self.running = True\n\n        #mark recordings e.g. 2023-01-01_12-00-00.mp4, shared by video and log\n        os.makedirs(self.folder, exist_ok=True)\n        name = time.strftime(\"%Y-%m-%d_%H-%M-%S\", time.localtime())\n        self.video_path = os.path.join(self.folder, f\"{name}.mp4\")\n        self.log_path = os.path.join(self.folder, f\"{name}.json\")\n\n        self.log = open(self.log_path, \"w\")\n        self.writer = None      #made in run() when first frame shows the size\n        self.last_stamp = 0.0   #stamp of last frame written, so no frame is written twice\n        self.frames = 0         #frames written, to check the video length afterwards\n\n        if autostart:\n            self.start()\n\n    def run(self):\n        while self.running:\n            frame, stamp = self.feed.read()\n            if frame is None or stamp == self.last_stamp:\n                time.sleep(0.005)\n                continue\n            self.last_stamp = stamp\n\n            if self.writer is None:\n                h, w = frame.shape[:2]\n                fourcc = cv2.VideoWriter_fourcc(*\"mp4v\")\n                self.writer = cv2.VideoWriter(self.video_path, fourcc, self.fps, (w, h))\n                if not self.writer.isOpened():\n                    print(\"Error: Could not open video writer\")\n                    self.running = False\n                    return\n\n            self.writer.write(frame)\n            self.frames += 1\n\n            box, det_id, det_stamp = self.yolo.get_detection()\n            command, cmd_stamp = self.target.get_target()\n            row = {\n                \"frame\": self.frames,\n                \"frame_stamp\": round(stamp, 3),\n                \"box\": [round(v, 1) for v in box] if box is not None else None,\n                \"det_id\": det_id,\n                \"det_stamp\": round(det_stamp, 3),\n                \"command\": command,\n                \"cmd_stamp\": round(cmd_stamp, 3),\n            }\n            self.log.write(json.dumps(row) + \"\\n\")\n\n            if self.frames % 50 == 0:\n                self.log.flush()  # flush every 50 frames to avoid data loss\n\n    def stop(self):\n        self.running = False\n\n        if self.is_alive():\n            self.join(timeout=3.0)\n\n        if self.writer is not None:\n            self.writer.release()\n            self.writer = None\n\n        if not self.log.closed:\n            self.log.close()\n\n        print(f\"Recorder stopped. Video saved to {self.video_path}, log saved to {self.log_path}\")", "line": 1, "doc": {"summary": "Gemmer video og en log over detektioner og kommandoer."}, "id": "ptz-code-recorderclass-py", "missing": false}, "ptz-code-static": {"key": "ptz/code/static", "kind": "folder", "name": "static", "parent": "ptz-code", "children": ["ptz-code-static-index-html"], "doc": {"summary": "Statiske filer til websiden."}, "id": "ptz-code-static", "missing": false}, "ptz-code-static-index-html": {"key": "ptz/code/static/index.html", "kind": "file", "name": "index.html", "parent": "ptz-code-static", "children": ["ptz-code-static-index-html-send", "ptz-code-static-index-html-show"], "file": "ptz/code/static/index.html", "size": 2110, "text": true, "ext": ".html", "buttons": [{"id": "record", "label": "Record", "handler": "send", "route": "/record"}, {"id": "manual", "label": "Auto", "handler": "send", "route": "/manual"}, {"id": "stop", "label": "Stop camera", "handler": "send", "route": "/stop"}], "source": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>PTZ Control<\/title>\n<style>\n  body {\n   font-family: system-ui, sans-serif; margin:24px;}\n   button {font-size: 18px; padding: 14px 24px; margin: 0 8px 8px 0; border-radius: 8px; border: 1px solid #888; cursor: pointer; }\n   #record.on { background: #c62828; color: white; border-color: #c62828; }         \n   #manual.on { background: #1565c0; color: white; border-color: #1565c0; }\n   #stop { background: #333; color: white; }\n   #info { font-family: monospace; color: #555; }\n   #error { color: #c62828; }     \n<\/style>\n<\/head>\n<body>\n    <h1>PTZ Control<\/h1>\n    <button id=\"record\">Record<\/button>\n    <button id=\"manual\">Auto<\/button>\n    <button id=\"stop\">Stop camera<\/button>\n\n\n     <p id=\"info\"><\/p>\n     <p id=\"error\"><\/p>\n\n\n    <script>\n    // Sends a button press to the server and shows the state it answers with.\n    async function send(path) {\n    try {\n    const answer = await fetch(path, { method: \"POST\" });\n    show(await answer.json());\n    } \n    catch (e) {\n    document.getElementById(\"error\").textContent = \"No answer from the server\";\n    }\n}\n\n// The page only shows what the server says; the state itself lives in Python.\nfunction show(s) {\n  const rec = document.getElementById(\"record\");\n  rec.textContent = s.recording ? \"Stop recording\" : \"Record\";\n  rec.classList.toggle(\"on\", s.recording);\n\n  const man = document.getElementById(\"manual\");\n  man.textContent = s.manual ? \"Manual\" : \"Auto\";\n  man.classList.toggle(\"on\", s.manual);\n\n  document.getElementById(\"info\").textContent = JSON.stringify(s);\n  document.getElementById(\"error\").textContent = s.error || \"\";\n}\n\ndocument.getElementById(\"record\").onclick = () => send(\"/record\");\ndocument.getElementById(\"manual\").onclick = () => send(\"/manual\");\ndocument.getElementById(\"stop\").onclick = () => send(\"/stop\");\n\nfetch(\"/state\").then(r => r.json()).then(show);   // show the state when the page opens\n<\/script>\n<\/body>\n<\/html>", "line": 1, "doc": {"summary": "Websiden med tre knapper. Siden har ingen egen tilstand: hvert tryk sender en POST til serveren og viser det svar, den får."}, "id": "ptz-code-static-index-html", "missing": false}, "ptz-code-targetclass-py": {"key": "ptz/code/targetClass.py", "kind": "file", "name": "targetClass.py", "parent": "ptz-code", "children": ["ptz-code-targetclass-py-targetcalculator"], "file": "ptz/code/targetClass.py", "size": 1160, "text": true, "ext": ".py", "module_doc": null, "source": "from collections import deque\nimport time\nfrom credentials import MAX_ACCEL, MOTION_HZ, FRAME_WIDTH, FRAME_HEIGHT\n\nclass TargetCalculator():\n    def __init__(self, max_accel=MAX_ACCEL, rate=MOTION_HZ, history=5):\n        self._history = deque(maxlen=history)\n        self.max_accel = max_accel\n        self.dt = 1 / rate\n        self.target = (0.0, 0.0)\n        self.current = [0.0, 0.0]\n        self.current_command = f\"continuouspantiltmove={0},{0}\", 0.0  # Initialize with a default command and timestamp\n\n    def get_target(self):\n        return self.current_command\n\n    def calculate_command(self, x1, y1, x2, y2, _id, _time_stamp, frame_width=FRAME_WIDTH, frame_height=FRAME_HEIGHT): #Should be run after every detection in yoloClass.py\n        #how do I control my camera movement? PID?\n        PANPID = 0  #E.g. Values\n        TILTPID = 0 #E.g. Values\n        self.current_command = f\"continuouspantiltmove={PANPID},{TILTPID}\", _time_stamp  # Return the latest command and its timestamp\n\n    def target_lost(self):\n        self.current_command = f\"continuouspantiltmove={0},{0}\", time.time()  # Stop movement when target is lost", "line": 1, "doc": {"summary": "Omsætter en boks i billedet til en PTZ-kommando."}, "id": "ptz-code-targetclass-py", "missing": false}, "ptz-code-yoloclass-py": {"key": "ptz/code/yoloClass.py", "kind": "file", "name": "yoloClass.py", "parent": "ptz-code", "children": ["ptz-code-yoloclass-py-detectionmodel"], "file": "ptz/code/yoloClass.py", "size": 2368, "text": true, "ext": ".py", "module_doc": null, "source": "import threading, time\nfrom ultralytics import YOLO\nfrom credentials import MODEL, DEFAULT_CONFIDENCE\n\n# This function should, near to, only be used by the controller class to calculate the velocity and accel- changes. By default the object autostarts the threading.\n# 1. Use self.get_detection(), which returns \n# \"self._detection, self._detection_id, self._stamp\" e.g. : \"(x1, y1, x2, y2), 1...100.000, 0.01...10.32\"\n#                                                    \"Position in coordinates,  image id,    time stamp\"  \n#--------------------------------------------self.get_detection()--------------------------------------\nclass DetectionModel(threading.Thread):\n    def __init__(self, feed, confidence=DEFAULT_CONFIDENCE, autostart=True):\n        super().__init__(daemon=True)\n        self.feed, self.confidence = feed, confidence\n        self.model = YOLO(MODEL)\n        self._detection = None            # (x1, y1, x2, y2) or None\n        self._detection_id = 0            # increases for every processed frame\n        self._stamp = 0.0\n        self._lock = threading.Lock()\n        self.running = True\n        if autostart:\n            self.start()\n\n    def run(self):\n        last = 0.0\n        while self.running:\n            frame, stamp = self.feed.read()\n            if frame is None or stamp == last:\n                time.sleep(0.005)\n                continue\n            last = stamp\n\n            result = self.model.predict(frame, conf=self.confidence, verbose=False)[0]\n            det = self._best_boxes(result)\n            with self._lock:\n                self._detection = det\n                self._detection_id += 1\n                self._stamp = stamp          # Since yolo operate slower than the feed, the box can be analyzed to be 10-200 ms, depends on tests. The stamp locks the age of the frame.\n\n    def _best_boxes(self, result):\n        found = result.boxes\n        if found is None or len(found) == 0:\n            return None\n        best = int(found.conf.argmax())\n        x1, y1, x2, y2 = found.xyxy[best].tolist()\n        return x1, y1, x2, y2\n\n    def get_detection(self):\n        with self._lock:\n            return self._detection, self._detection_id, self._stamp\n\n    def stop(self):\n        self.running = False\n        if self.is_alive():\n            self.join(timeout=3.0)", "line": 1, "doc": {"summary": "Kører YOLO på hvert nyt billede fra feedet i sin egen tråd."}, "id": "ptz-code-yoloclass-py", "missing": false}, "ptz-docker-compose-yml": {"key": "ptz/docker-compose.yml", "kind": "file", "name": "docker-compose.yml", "parent": "ptz", "children": [], "file": "ptz/docker-compose.yml", "size": 341, "text": true, "ext": ".yml", "source": "services:\n  tracker:\n    build: .\n    ports:\n      - \"8080:8080\"\n    volumes:\n      - .:/app\n      - ./credentials.py:/app/credentials.py:ro\n    deploy:\n      resources:\n        reservations:\n          devices:\n            - driver: nvidia\n              count: all\n              capabilities: [gpu]\n    restart: unless-stopped", "line": 1, "doc": {"summary": "Én service, tracker: bygger Dockerfile, åbner port 8080 (GUI), mounter hele ptz-mappen som /app (så koden kan ændres uden at bygge igen), giver adgang til alle NVIDIA-GPU'er og genstarter selv."}, "id": "ptz-docker-compose-yml", "missing": false}, "ptz-models": {"key": "ptz/models", "kind": "folder", "name": "models", "parent": "ptz", "children": ["ptz-models-handsmodel-pt"], "doc": {"summary": "YOLO-vægte. Mountes ind i containeren som /app/models."}, "id": "ptz-models", "missing": false}, "ptz-models-handsmodel-pt": {"key": "ptz/models/handsModel.pt", "kind": "file", "name": "handsModel.pt", "parent": "ptz-models", "children": [], "file eed", "missing": false}, "ptz-code-credentials-py-model": {"key": "ptz/code/credentials.py::MODEL", "kind": "config", "name": "MODEL", "parent": "ptz-code-credentials-py", "children": [], "file": "ptz/code/credentials.py", "line": 19, "end": 19, "value": "'/app/models/handsModel.pt'", "sensitive": false, "comment": "", "unused": false, "id": "ptz-code-credentials-py-model", "missing": false}, "ptz-code-credentials-py-default-confidence": {"key": "ptz/code/credentials.py::DEFAULT_CONFIDENCE", "kind": "config", "name": "DEFAULT_CONFIDENCE", "parent": "ptz-code-credentials-py", "children": [], "file": "ptz/code/credentials.py", "line": 20, "end": 20, "value": "0.8", "sensitive": false, "comment": "", "unused": false, "id": "ptz-code-credentials-py-default-confidence", "missing": false}, "ptz-code-controllerclass-py-commandptz": {"key": "ptz/code/controllerClass.py::commandPTZ", "kind": "class", "name": "commandPTZ", "parent": "ptz-code-controllerclass-py", "children": ["ptz-code-controllerclass-py-commandptz-init", "ptz-code-controllerclass-py-commandptz-run", "ptz-code-controllerclass-py-commandptz-send-command", "ptz-code-controllerclass-py-commandptz-search", "ptz-code-controllerclass-py-commandptz-stop"], "file": "ptz/code/controllerClass.py", "line": 5, "def_line": 5, "end": 59, "bases": ["threading.Thread"], "thread": true, "comments": [], "docstring": null, "source": "class commandPTZ(threading.Thread):\n    def __init__(self, get_target_func, autostart=True):\n        super().__init__(daemon=True)\n        self.get_target_func = get_target_func\n        self.session = requests.Session()\n        self.session.auth = HTTPDigestAuth(CAMERA_USER, CAMERA_PASSWORD)\n        self._lock = threading.Lock()\n        self.running = True\n        self.command = None\n        self.last_stamp = 0.0\n        self.last_time = time.time()  #Used for debug.\n        self.debug_time = time.time() #Used for debug.\n        if autostart:\n            self.start()\n\n    def run(self):\n        while self.running:\n            self.command, stamp = self.get_target_func()\n            if stamp == self.last_stamp:      #command == self.last_command, is already handled by the stamp, so no need to check both.\n                time.sleep(0.02)        #Put the trejactory calculation here, so when no new command is recieved \n                self._search()          #Here I search for the drone after during no information from the yolo detection, so the camera will keep moving in a search pattern until a new command is recieved.\n                continue\n            else:\n                self.last_stamp = stamp\n                self._send_command()\n                self.last_time = time.time()\n\n    \n    def _send_command(self):\n        url = f\"http://{CAMERA_IP}/axis-cgi/com/ptz.cgi?{self.command}\"\n        try:\n            response = self.session.get(url, timeout=0.5)\n            response.raise_for_status()\n            return response.text\n        except requests.exceptions.RequestException as e:\n            print(f\"PTZ send failed: {e}\")\n            return None\n    \n    def _search(self):\n        self.debug_time = time.time() - self.last_time\n        if self.debug_time > 1.0:\n            self.command = \"continuouspantiltmove=0,0\" #Stops the camera after 1 second of no detection.\n            self._send_command() #Stops the camera after 1 second of no detection.\n\n        if self.debug_time > 1.0: #Debug code for the search function.\n            self.debug_time = 0.0\n            self.last_time = time.time()\n            print(\"No new command recieved, searching..\") #The PTZ camera should search for drone. Here.\n\n    def stop(self):\n        self.running = False\n        self.command = \"continuouspantiltmove=0,0\"\n        self._send_command()  # Send a stop command to the camera\n        if self.is_alive():\n            self.join(timeout=3.0)", "doc": {"summary": "Tråd der hele tiden spørger TargetCalculator om den nyes send_command()", "source": "    def _send_command(self):\n        url = f\"http://{CAMERA_IP}/axis-cgi/com/ptz.cgi?{self.command}\"\n        try:\n            response = self.session.get(url, timeout=0.5)\n            response.raise_for_status()\n            return response.text\n        except requests.exceptions.RequestException as e:\n            print(f\"PTZ send failed: {e}\")\n            return None", "externals": ["self.session.get", "response.raise_for_status"], "doc": {"summary": "Sender self.command til kameraet. Fejl (timeout, forkert login) skrives i konsollen, så tråden ikke dør.", "returns": "Kameraets svartekst, eller None ved fejl."}, "id": "ptz-code-controllerclass-py-commandptz-send-command", "missing": false}, "ptz-code-controllerclass-py-commandptz-search": {"key": "ptz/code/controllerClass.py::commandPTZ._search", "kind": "method", "name": "_search", "parent": "ptz-code-controllerclass-py-commandptz", "children": [], "file": "ptz/code/controllerClass.py", "line": 43, "def_line": 43, "end": 52, "params": [], "returns": [], "comments": [], "inline_comment": "", "docstring": null, "route": null, "decorators": [], "private": true, "signature": "def _search()", "source": "    def _search(self):\n        self.debug_time = time.time() - self.last_time\n        if self.debug_time > 1.0:\n            self.command = \"continuouspantiltmove=0,0\" #Stops the camera after 1 second of no detection.\n            self._send_command() #Stops the camera after 1 second of no detection.\n\n        if self.debug_time > 1.0: #Debug code for the search function.\n            self.debug_time = 0.0\n            self.last_time = time.time()\n            print(\"No new command recieved, searching..\") #The PTZ camera should search for drone. Here.", "externals": ["time.time"], "doc": {"summary": "Kaldes når der ikke er kommet ny kommando. Er der gået mere end 1 s siden sidste kommando, sendes 0,0 (stop), og der skrives 'searching..'. Selve søgemønsteret er ikke lavet.", ,800 bytes, about 6.2 MB per frame.", "--------------------------------------------self.read()--------------------------------------"], "docstring": null, "source": "# This class main function is to get the live feed through RTSP, creating a object of this auto starts run(), and starts the threading for class.\n# 1. Use the function self.read() to get the newest frame and its timestamp.\n# \"frame, stamp\" = \"(frame.shape, frame.dtype), stamp\"e.g. : \"((1080, 1920, 3), uint8), 0.01...10.32\"\n# uint8 holds the BGR farvene: which means every frame is the Size: 1080 × 1920 × 3 = 6,220,800 bytes, about 6.2 MB per frame.\n#--------------------------------------------self.read()--------------------------------------\nclass FeedRTSP(threading.Thread):\n    def __init__(self, ip=CAMERA_IP, user=CAMERA_USER, password=CAMERA_PASSWORD, resolution=f\"{FRAME_WIDTH}x{FRAME_HEIGHT}\", autostart=True):\n        super().__init__(daemon=True)\n        self.url = (f\"rtsp://{user}:{password}@{ip}\"\n                    f\"/axis-media/media.amp?videocodec=h264&resolution={resolution}\")\n        self.frame = None\n        self.stamp = 0.0\n        self.frames = 0\n        self.error = None\n        self.lock = threading.Lock()\n        self.running = True\n\n        if autostart:\n            self.start()\n\n    def run(self):\n        while self.running:\n            cap = cv2.VideoCapture(self.url, cv2.CAP_FFMPEG)\n            if not cap.isOpened():\n                self.error = \"Cant Open the Stream\"\n                cap.release()\n                time.sleep(2.0)\n                continue\n            self.error = None\n            while self.running:\n                ok, frame = cap.read()\n                if not ok:\n                    self.error = \"stream Interrupted\"\n                    break\n                with self.lock:\n                    self.frame = frame\n                    self.stamp = time.time()\n                    self.frames += 1\n            cap.release()\n\n    def read(self):\n        with self.lock:\n            if self.frame is None:\n                return None, 0.0\n            return self.frame.copy(), self.stamp\n\n    def stop(self):\n        self.running = False\n        if self.is_alive():\n            self.join(timeout=3.0)", "doc": {"summary": "Tråd der læser RTSP-streamen fra kameraet så hurtigt som muligt og kun gemmer det nyeste billede. Alle andre (YOLO, Recorder) henter billeder med read(). Mister den forbindelsen, prøver den igen hvert 2. sekund.", "sends": "Det nyeste billede som numpy-array 1080×1920×3 (BGR, uint8, ca. 6,2 MB) plus tidsstemplet time.time() fra da det blev modtaget."}, "id": "ptz-code-feedclass-py-feedrtsp", "missing": false}, "ptz-code-feedclass-py-feedrtsp-init": {"key": "ptz/code/feedClass.py::FeedRTSP.__init__", "kind": "method", "name": "__init__", "parent": "ptz-code-feedclass-py-feedrtsp", "children": [], "file": "ptz/code/feedClass.py", "line": 13, "def_line": 13, "end": 25, "params": [{"name": "ip", "default": "CAMERA_IP", "ann": null}, {"name": "user", "default": "CAMERA_USER", "ann": null}, {"name": "password", "default": "CAMERA_PASSWORD", "ann": null}, {"name": "resolution", "default": "f'{FRAME_WIDTH}x{FRAME_HEIGHT}'", "ann": null}, {"name": "autostart", "default": "True", "ann": null}], "returns": [], "comments": [], "inline_comment": "", "docstring": null, "route": null, "decorators": [], "private": false, "signature": "def __init__(ip=CAMERA_IP, user=CAMERA_USER, password=CAMERA_PASSWORD, resolution=f'{FRAME_WIDTH}x{FRAME_HEIGHT}', autostart=True)", "source": "    def __init__(self, ip=CAMERA_IP, user=CAMERA_USER, password=CAMERA_PASSWORD, resolution=f\"{FRAME_WIDTH}x{FRAME_HEIGHT}\", autostart=True):\n        super().__init__(daemon=True)\n        self.url = (f\"rtsp://{user}:{password}@{ip}\"\n                    f\"/axis-media/media.amp?videocodec=h264&resolution={resolution}\")\n        self.frame = None\n        self.stamp = 0.0\n        self.frames = 0\n -py-guiserver": {"key": "ptz/code/guiClass.py::GUIServer", "kind": "class", "name": "GUIServer", "parent": "ptz-code-guiclass-py", "children": ["ptz-code-guiclass-py-guiserver-init", "ptz-code-guiclass-py-guiserver-routes", "ptz-code-guiclass-py-guiserver-state", "ptz-code-guiclass-py-guiserver-run", "ptz-code-guiclass-py-guiserver-stop"], "file": "ptz/code/guiClass.py", "line": 7, "def_line": 7, "end": 82, "bases": ["threading.Thread"], "thread": true, "comments": [], "docstring": null, "source": "class GUIServer(threading.Thread):\n        \n    def __init__(self, feed=None, yolo=None, target=None, folder=\"/app/recordings\", port=8080, autostart=True):\n        super().__init__(daemon=True)\n        self.feed, self.yolo, self.target = feed, yolo, target\n        self.folder = folder\n        self.rec = None             # the running Recorder, or None\n        self.manual = False\n        self.stops = 0\n        self._lock = threading.Lock()\n\n        here = os.path.dirname(os.path.abspath(__file__))\n        self.app = Flask(__name__, static_folder=os.path.join(here, \"static\"))\n        self._routes()\n        self.server = make_server(\"•••\", port, self.app, threaded=True)\n        if autostart:\n            self.start()\n\n    def _routes(self):\n        app = self.app\n        \n        @app.route(\"/\")\n        def page_index():\n            return send_from_directory(app.static_folder, \"index.html\")\n\n        @app.route(\"/state\")\n        def state():\n            return jsonify(self.state())\n\n        @app.route(\"/record\", methods=[\"POST\"])\n        def record():\n            if self.feed is None:\n                return jsonify({**self.state(), \"error\": \"no camera feed - start the GUI from main.py\"}), 503\n            with self._lock:\n                old, self.rec = self.rec, None\n                if old is None:\n                    self.rec = Recorder(self.feed, self.yolo, self.target, folder=self.folder)\n            if old is not None:\n                old.stop()          # outside the lock: stop() can take up to 3 s\n            print(\"GUI: recording\", self.rec is not None)\n            return jsonify(self.state())\n\n        @app.route(\"/manual\", methods=[\"POST\"])\n        def manual():\n            with self._lock:\n                self.manual = not self.manual\n            print(\"GUI: manual\", self.manual)\n            return jsonify(self.state())\n        \n        @app.route(\"/stop\", methods=[\"POST\"])\n        def stop():\n            with self._lock:\n                self.stops += 1\n            print(\"GUI: stop camera\")\n            return jsonify(self.state())\n\n    def state(self):\n        with self._lock:\n            return {\n                \"recording\": self.rec is not None,\n                \"file\": os.path.basename(self.rec.video_path) if self.rec else None,\n                \"manual\": self.manual,\n                \"stops\": self.stops,\n            }\n    \n    def run(self):\n        self.server.serve_forever()\n\n    def stop(self):\n        with self._lock:\n            old, self.rec = self.rec, None\n        if old is not None:\n            old.stop()              # close a running recording before the program ends\n        self.server.shutdown()\n        if self.is_alive():\n            self.join(timeout=3.0)", "doc": {"summary": "Tråd der kører en Flask-server. Den holder styr på, om der optages (self.rec), om manuel tilstand er slået til, og hvor mange gange Stop er trykket. Websiden viser kun det, serveren svarer, så tilstanden findes ét sted.", "sends": "JSON med {recording, file, manual, stops} som svar på hver route."}, "id": "ptz-code-guiclass-py-guiserver", "missing": false}, "ptz-code-guiclass-py-guiserver-init": {"key": "ptz/code/guiClass.py::GUIServer.__init__", "kind": "method", "name": "__init__", "parent": "ptz-code-guiclass-py-guiserver", "children": [], "file": "ptz/code/guiClass.py", "line": 9, "def_line": 9, "end": 23, "params": [{"n lf: maybe need a \"(RTSP, None)\" just removed\n    TARGET = TargetCalculator()\n    CONTROLLER = commandPTZ(TARGET.get_target)  #Maybe need TARGET.update() somewhere; see targetClass.py, but not sure where to put it. Maybe in the yoloClass.py after every detection, but then I need to pass the stamp and the 2 cornors of the boundary box to the targetClass.py.\n                                                #Also TARGET.get_target() returns both command and time stamp. \"command\", self._history[-1][2]\n    GUI = GUIServer(feed=RTSP, yolo=YOLO, target=TARGET)\n    try:\n        last_id = None\n        while True:\n            box_info = YOLO.get_detection()                           # newest result, never blocks\n            position, det_id, time_stamp = box_info[0], box_info[1], box_info[2]  # maybe not needed cant figure.\n\n            if det_id != last_id:\n                last_id = det_id\n                if position is None:\n                    TARGET.target_lost() \n\n                else:\n                    x1, y1, x2, y2 = position\n                    TARGET.calculate_command(x1, y1, x2, y2, det_id, time_stamp)\n                    last_id = det_id\n\n            time.sleep(0.01)                                                          # don't spin at 100% CPU\n    except KeyboardInterrupt:\n        pass\n    finally:\n        GUI.stop()\n        CONTROLLER.stop()\n        YOLO.stop()\n        RTSP.stop()", "externals": ["time.sleep"], "doc": {"summary": "Opretter FeedRTSP, DetectionModel, TargetCalculator, commandPTZ og GUIServer i den rækkefølge, de afhænger af hinanden. Derefter tjekker løkken hvert 10. ms, om YOLO har et nyt resultat (nyt det_id). Har den en boks, kaldes calculate_command(); er der ingen boks, kaldes target_lost(). Ved Ctrl+C stoppes alt i omvendt rækkefølge.", "returns": "Intet. Kører indtil Ctrl+C.", "notes": "commandPTZ får funktionen TARGET.get_target (uden parentes), ikke selve objektet. Den kan så selv hente den nyeste komman         if autostart:\n            self.start()\n\n    def run(self):\n        while self.running:\n            frame, stamp = self.feed.read()\n            if frame is None or stamp == self.last_stamp:\n                time.sleep(0.005)\n                continue\n            self.last_stamp = stamp\n\n            if self.writer is None:\n                h, w = frame.shape[:2]\n                fourcc = cv2.VideoWriter_fourcc(*\"mp4v\")\n                self.writer = cv2.VideoWriter(self.video_path, fourcc, self.fps, (w, h))\n                if not self.writer.isOpened():\n                    print(\"Error: Could not open video writer\")\n                    self.running = False\n                    return\n\n            self.writer.write(frame)\n            self.frames += 1\n\n            box, det_id, det_stamp = self.yolo.get_detection()\n            command, cmd_stamp = self.target.get_target()\n            row = {\n                \"frame\": self.frames,\n                \"frame_stamp\": round(stamp, 3),\n                \"box\": [round(v, 1) for v in box] if box is not None else None,\n                \"det_id\": det_id,\n                \"det_stamp\": round(det_stamp, 3),\n                \"command\": command,\n                \"cmd_stamp\": round(cmd_stamp, 3),\n            }\n            self.log.write(json.dumps(row) + \"\\n\")\n\n            if self.frames % 50 == 0:\n                self.log.flush()  # flush every 50 frames to avoid data loss\n\n    def stop(self):\n        self.running = False\n\n        if self.is_alive():\n            self.join(timeout=3.0)\n\n        if self.writer is not None:\n            self.writer.release()\n            self.writer = None\n\n        if not self.log.closed:\n            self.log.close()\n\n        print(f\"Recorder stopped. Video saved to {self.video_path}, log saved to {self.log_path}\")", "doc": {"summary": "Tråd der startes fra GUI'en. Hvert nyt billede fra feedet skrives til en .mp4, og der skrives en linje i e = 1\n\n            box, det_id, det_stamp = self.yolo.get_detection()\n            command, cmd_stamp = self.target.get_target()\n            row = {\n                \"frame\": self.frames,\n                \"frame_stamp\": round(stamp, 3),\n                \"box\": [round(v, 1) for v in box] if box is not None else None,\n                \"det_id\": det_id,\n                \"det_stamp\": round(det_stamp, 3),\n                \"command\": command,\n                \"cmd_stamp\": round(cmd_stamp, 3),\n            }\n            self.log.write(json.dumps(row) + \"\\n\")\n\n            if self.frames % 50 == 0:\n                self.log.flush()  # flush every 50 frames to avoid data loss", "externals": ["self.writer.write", "self.log.write", "time.sleep", "cv2.VideoWriter_fourcc", "cv2.VideoWriter", "self.log.flush", "self.writer.isOpened", "json.dumps"], "doc": {"summary": "Trådens løkke. Nyt billede → skriv til video, hent get_detection() og get_target(), og skriv én JSON-linje. Loggen gemmes til disk for hver 50. billede.", "returns": "Intet. Stopper selv, hvis video-writeren ikke kan åbnes."}, "id": "ptz-code-recorderclass-py-recorder-run", "missing": false}, "ptz-code-recorderclass-py-recorder-stop": {"key": "ptz/code/recorderClass.py::Recorder.stop", "kind": "method", "name": "stop", "parent": "ptz-code-recorderclass-py-recorder", "children": [], "file": "ptz/code/recorderClass.py", "line": 61, "def_line": 61, "end": 74, "params": [], "returns": [], "comments": [], "inline_comment": "", "docstring": null, "route": null, "decorators": [], "private": false, "signature": "def stop()", "source": "    def stop(self):\n        self.running = False\n\n        if self.is_alive():\n            self.join(timeout=3.0)\n\n        if self.writer is not None:\n            self.writer.release()\n            self.writer = None\n\n        if not self.log.closed:\n            self.log.close()\n\n        print(f\"Recorder stopped. Video saved to {self.video_path}, log saved to {s y detection in yoloClass.py\n        #how do I control my camera movement? PID?\n        PANPID = 0  #E.g. Values\n        TILTPID = 0 #E.g. Values\n        self.current_command = f\"continuouspantiltmove={PANPID},{TILTPID}\", _time_stamp  # Return the latest command and its timestamp", "externals": [], "doc": {"summary": "Skal regne pan- og tilt-hastighed ud fra hvor boksen ligger i forhold til billedets midte. Lige nu er PANPID og TILTPID 0, så kommandoen er altid 'stå stille'. Tidsstemplet sættes til billedets tidsstempel, så commandPTZ kan se, at der er kommet noget nyt.", "params": {"x1": "Boksens venstre kant (px).", "y1": "Boksens øverste kant (px).", "x2": "Boksens højre kant (px).", "y2": "Boksens nederste kant (px).", "_id": "YOLO's det_id. Ikke brugt.", "_time_stamp": "Tidsstempel for billedet boksen kommer fra.", "frame_width": "Billedbredde, standard 1920.", "frame_height": "Billedhøjde, standard 1080."}, "returns": "Intet. Resultatet gemmes i self.current_command.", "todo": ["Beregn fejl = boksens centrum − billedets centrum og lav en regulator (fx PID) til pan/tilt."]}, "id": "ptz-code-targetclass-py-targetcalculator-calculate-command", "missing": false}, "ptz-code-targetclass-py-targetcalculator-target-lost": {"key": "ptz/code/targetClass.py::TargetCalculator.target_lost", "kind": "method", "name": "target_lost", "parent": "ptz-code-targetclass-py-targetcalculator", "children": [], "file": "ptz/code/targetClass.py", "line": 23, "def_line": 23, "end": 24, "params": [], "returns": [], "comments": [], "inline_comment": "", "docstring": null, "route": null, "decorators": [], "private": false, "signature": "def target_lost()", "source": "    def target_lost(self):\n        self.current_command = f\"continuouspantiltmove={0},{0}\", time.time()  # Stop movement when target is lost", "externals": ["time.time"], "doc": {"summary": "Kaldes når YOLO ikke fandt noget. Sætter kommandoen til 0,0 med det nuværende tidspunkt, så commandPTZ sender stop.", "returns": "Intet."}, "id": "ptz-code-targetclass-py-targetcalculator-target-lost", "missing": false}, "ptz-code-yoloclass-py-detectionmodel": {"key": "ptz/code/yoloClass.py::DetectionModel", "kind": "class", "name": "DetectionModel", "parent": "ptz-code-yoloclass-py", "children": ["ptz-code-yoloclass-py-detectionmodel-init", "ptz-code-yoloclass-py-detectionmodel-run", "ptz-code-yoloclass-py-detectionmodel-best-boxes", "ptz-code-yoloclass-py-detectionmodel-get-detection", "ptz-code-yoloclass-py-detectionmodel-stop"], "file": "ptz/code/yoloClass.py", "line": 5, "def_line": 10, "end": 54, "bases": ["threading.Thread"], "thread": true, "comments": ["This function should, near to, only be used by the controller class to calculate the velocity and accel- changes. By default the object autostarts the threading.", "1. Use self.get_detection(), which returns", "\"self._detection, self._detection_id, self._stamp\" e.g. : \"(x1, y1, x2, y2), 1...100.000, 0.01...10.32\"", "\"Position in coordinates,  image id,    time stamp\"", "--------------------------------------------self.get_detection()--------------------------------------"], "docstring": null, "source": "# This function should, near to, only be used by the controller class to calculate the velocity and accel- changes. By default the object autostarts the threading.\n# 1. Use self.get_detection(), which returns \n# \"self._detection, self._detection_id, self._stamp\" e.g. : \"(x1, y1, x2, y2), 1...100.000, 0.01...10.32\"\n#                                                    \"Position in coordinates,  image id,    time stamp\"  \n#--------------------------------------------self.get_detection()--------------------------------------\nclass DetectionModel(threading.Thread):\n    def __init__(self, feed, confidence=DEFAULT_CONFIDENCE, autostart=True):\n        super().__init__(daemon=True)\n        self.feed, self.confidence = feed, confidence\n        self.model = YOLO(MODEL)\n        self._detection = None            # (x1, y1, x2, y2) or None\n        self._detection_id = 0            # increases for every processed frame\n        self._stamp = 0.0\n        self._lock = threading.Lock()\n        self.running = True\n        if autostart:\n            self.start()\n\n    def run(self):\n        last = 0.0\n        while self.running:\n            frame, stamp = self.feed.read()\n            if frame is None or stamp == last:\n                time.sleep(0.005)\n                continue\n            last = stamp\n\n            result = self.model.predict(frame, conf=self.confidence, verbose=False)[0]\n            det = self._best_boxes(result)\n            with self._lock:\n                self._detection = det\n                self._detection_id += 1\n                self._stamp = stamp          # Since yolo operate slower than the feed, the box can be analyzed to be 10-200 ms, depends on tests. The stamp locks the age of the frame.\n\n    def _best_boxes(self, result):\n        found = result.boxes\n        if found is None or len(found) == 0:\n            return None\n        best = int(found.conf.argmax())\n        x1, y1, x2, y2 = found.xyxy[best].tolist()\n        return x1, y1, x2, y2\n\n    def get_detection(self):\n        with self._lock:\n            return self._detection, self._detection_id, self._stamp\n\n    def stop(self):\n        self.running = False\n        if self.is_alive():\n            self.join(timeout=3.0)", "doc": {"summary": "Tråd der henter det nyeste billede fra FeedRTSP, kører YOLO på hele billedet og gemmer den boks med højest confidence. YOLO er langsommere end kameraet, så billeder springes over. Den tager altid det nyeste.", "sends": "Via get_detection(): boks (x1, y1, x2, y2) i pixels eller None, et løbenummer der stiger for hvert behandlet billede, og billedets tidsstempel."}, "id": "ptz-code-yoloclass-py-detectionmodel", "missing": false}, "ptz-code-yoloclass-py-detectionmodel-init": {"key": "ptz/code/yoloClass.py::DetectionModel.__init__", "kind": "method" const NW = 162, NH = 54, CX = NW + 150, CY = NH + 86, PAD = 22, CH = 6.4;
const map = (() => {
  const nodes = D.diagram.map(n => Object.assign({}, n)), idx = {};
  nodes.forEach(n => idx[n.id] = n);
  const covered = id => { for (let c = id; c; c = S[c] && S[c].parent) if (idx[c]) return c; return null; };
  let ax = 0; const baseY = nodes.reduce((m, n) => Math.max(m, n.y), -1) + 1;
  Object.values(S).forEach(s => {
    const want = s.kind === "class" || (s.kind === "file" && /\.html?$/.test(s.name)) || (s.kind === "function" && S[s.parent].kind === "file" && OUT[s.id]);
    if (want && !covered(s.id)) { const n = { id: s.id, x: ax++, y: baseY, auto: true }; nodes.push(n); idx[s.id] = n; }
  });
  const agg = {};
  D.edges.forEach(e => {
    if (e.kind === "import" || e.kind === "config") return;
    const a = covered(e.from), b = covered(e.to);
    if (!a || !b || a === b) return;
    const k = a + ">" + b, g = agg[k] = agg[k] || { a, b, raw: [], labels: [], life: true, kinds: new Set() };
    const t = S[e.to], life = e.kind === "creates" || LIFE.has(t.name);
    g.raw.push(e); g.kinds.add(e.kind);
    if (!life) g.life = false;
    const lab = e.kind === "http" ? t.route.path : e.kind === "io" ? e.label : e.kind === "serves" ? "sender siden" : e.kind === "creates" ? "opretter" : t.name + "()";
    g.labels.push({ lab, life });
  });
  return { nodes, idx, covered, edges: Object.values(agg) };
})();

function drawMap() {
  const showLife = $("#show-life").checked;
  const svg = $("#map");
  const maxX = Math.max(...map.nodes.map(n => n.x)), maxY = Math.max(...map.nodes.map(n => n.y));
  const W = PAD * 2 + maxX * CX + NW, H = PAD * 2 + maxY * CY + NH;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const pos = n => ({ x: PAD + n.x * CX + NW / 2, y: PAD + n.y * CY + NH / 2 });
  const selNode = current ? map.covered(current) : null;
  const sub = current ? subtree(current) : new Set();
  const nodeLevel = current && map.idx[current];
  const clip = (c, t) => { const dx = t.x - c.x, dy = t.y - c.y; const s = Math.min((NW / 2 + 5) / Math.abs(dx || 1e-9), (NH / 2 + 5) / Math.abs(dy || 1e-9)); return { x: c.x + dx * s, y: c.y + dy * s }; };
  const near = new Set();
  // etiketter må ikke ligge oven på nodes eller andre etiketter
  const boxes = map.nodes.map(n => ({ x: PAD + n.x * CX - 4, y: PAD + n.y * CY - 4, w: NW + 8, h: NH + 8 }));
  const hits = b => boxes.some(o => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y);
  const qpt = (s, c, e, t) => ({ x: (1 - t) * (1 - t) * s.x + 2 * (1 - t) * t * c.x + t * t * e.x, y: (1 - t) * (1 - t) * s.y + 2 * (1 - t) * t * c.y + t * t * e.y });
  let out = `<defs>${["muted", "k-route", "accent", "k-ext"].map(c => `<marker id="ah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--${c})"/></marker>`).join("")}</defs>`;
  map.edges.forEach(g => {
    if (g.life && !showLife) return;
    const A = map.idx[g.a], B = map.idx[g.b], p0 = pos(A), p2 = pos(B);
    const dx = p2.x - p0.x, dy = p2.y - p0.y, len = Math.hypot(dx, dy) || 1;
    let off = 0;
    const rev = map.edges.find(o => o.a === g.b && o.b === g.a && (showLife || !o.life));
    if (rev) off += 16;
    if (A.y === B.y && Math.abs(A.x - B.x) > 1) off += NH + 50;
    if (A.x === B.x && Math.abs(A.y - B.y) > 1) off += NW + 50;
    const cx = (p0.x + p2.x) / 2 - dy / len * off, cy = (p0.y + p2.y) / 2 + dx / len * off;
    const s = clip(p0, { x: cx, y: cy }), e = clip(p2, { x: cx, y: cy });
    const kind = g.kinds.has("io") ? "io" : g.kinds.has("http") ? "http" : g.kinds.has("serves") ? "serves" : (g.kinds.size === 1 && g.kinds.has("creates")) ? "creates" : "call";
    const col = { io: "accent", http: "k-route", serves: "k-route", creates: "k-ext", call: "muted" }[kind];
    const hot = current && (nodeLevel ? (g.a === current || g.b === current) : g.raw.some(r => sub.has(r.from) || sub.has(r.to)));
    if (hot) { near.add(g.a); near.add(g.b); }
    let labs = [...new Set(g.labels.filter(l => showLife || !l.life).map(l => l.lab))].join(", ");
    const maxLen = Math.max(12, Math.floor((CX - NW - 16) / CH));
    if (labs.length > maxLen) labs = labs.slice(0, maxLen - 1) + "…";
    const lw = labs.length * CH + 8, lh = 15;
    let lx, ly, placed = null;
    for (const t of [0.5, 0.38, 0.62, 0.28, 0.72, 0.2, 0.8]) {
      const p = qpt(s, { x: cx, y: cy }, e, t), b = { x: p.x - lw / 2, y: p.y - lh / 2, w: lw, h: lh };
      if (!hits(b)) { placed = b; lx = p.x; ly = p.y; break; }
    }
    if (!placed) { const p = qpt(s, { x: cx, y: cy }, e, 0.5); lx = p.x; ly = p.y; placed = { x: lx - lw / 2, y: ly - lh / 2, w: lw, h: lh }; }
    boxes.push(placed);
    out += `<g class="edge e-${kind}${hot ? " hot" : ""}"><title>${esc(qual(g.a))} → ${esc(qual(g.b))}: ${esc([...new Set(g.labels.map(l => l.lab))].join(", "))}</title>`
      + `<path d="M${s.x.toFixed(1)} ${s.y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${e.x.toFixed(1)} ${e.y.toFixed(1)}" marker-end="url(#ah-${col})"/>`
      + `<text x="${lx.toFixed(1)}" y="${(ly + 3.5).toFixed(1)}" text-anchor="middle">${esc(labs)}</text></g>`;
  });
  map.nodes.forEach(n => {
    const s = S[n.id], x = PAD + n.x * CX, y = PAD + n.y * CY;
    const subl = s.kind === "external" ? s.sub : s.kind === "class" ? (s.thread ? "tråd · " : "") + (s.file || "").split("/").pop() : s.kind === "file" ? (s.ext === ".py" ? "config" : "webside") : (s.file || "").split("/").pop();
    const cls = ["node", s.kind === "external" ? "ext" : "", selNode === n.id ? "sel" : "", near.has(n.id) ? "near" : ""].join(" ");
    let nm = s.kind === "function" ? s.name + "()" : s.name; if (nm.length > 19) nm = nm.slice(0, 18) + "…";
    out += `<g class="${cls}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(qual(n.id))}"><rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="6"/>`
      + `<text class="tg" x="${x + 10}" y="${y + 15}" fill="var(--${{ class: "k-class", function: "k-method", external: "k-ext", file: "k-file" }[s.kind] || "k-file"})">${KIND[s.kind][0].toUpperCase()}</text>`
      + `<text class="nm" x="${x + 10}" y="${y + 31}">${esc(nm)}</text><text class="sb" x="${x + 10}" y="${y + 46}">${esc(subl)}</text></g>`;
  });
  svg.innerHTML = out;
  svg.classList.toggle("focus", !!selNode);
}
$("#map").addEventListener("click", e => { const n = e.target.closest(".node"); if (n) go(n.dataset.id); });
$("#map").addEventListener("keydown", e => { const n = e.target.closest(".node"); if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); go(n.dataset.id); } });

/* ---------- detail ---------- */
function highlight(src, ext) {
  const py = ext === ".py", js = ext === ".js" || ext === ".html";
  if (!py && !js) return esc(src);
  const kw = py ? "def|class|return|if|else|elif|while|for|in|try|except|finally|with|as|import|from|None|True|False|self|async|await|not|and|or|is|pass|continue|break|lambda|raise|global"
                : "function|async|await|const|let|var|return|if|else|for|while|try|catch|new|true|false|null|document";
  const re = new RegExp((py ? "(#.*$)" : "(\\/\\/.*$)") + "|(\"\"\"[\\s\\S]*?\"\"\"|'(?:\\\\.|[^'\\\\\\n])*'|\"(?:\\\\.|[^\"\\\\\\n])*\"" + (js ? "|`(?:\\\\.|[^`\\\\])*`" : "") + ")|\\b(" + kw + ")\\b|\\b(\\d+(?:\\.\\d+)?)\\b", "gm");
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const c = m[1] ? "h-c" : m[2] ? "h-s" : m[3] ? "h-k" : "h-n";
    out += `<span class="${c}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function sourceBlock(s) {
  if (!s.source) return "";
  const f = fileOf(s), ext = (f.match(/\.[a-z]+$/i) || [""])[0].toLowerCase();
  const lines = s.source.split("\n"), start = s.line || 1;
  const end = start + lines.length - 1;
  const gh = D.meta.web && D.meta.commit ? `${D.meta.web}/blob/${D.meta.commit}/${f}${s.kind === "file" ? "" : `#L${start}-L${end}`}` : "";
  const openIt = s.kind !== "file" && s.kind !== "class" && lines.length <= 40;
  return `<details class="src"${openIt ? " open" : ""}><summary><b>Kildekode</b><span class="mono">${esc(f)}:${start}–${end}</span>${gh ? `<a href="${gh}" target="_blank" rel="noopener">Åbn på GitHub ↗</a>` : ""}</summary>`
    + `<div class="code"><pre class="ln">${lines.map((_, i) => start + i).join("\n")}</pre><pre class="tx">${highlight(s.source, ext)}</pre></div></details>`;
}
function linkBtn(id, text) { return `<button class="link" data-go="${id}">${esc(text || qual(id))}</button>`; }
function edgeList(edges, dir) {
  if (!edges.length) return '<p class="empty">Ingen.</p>';
  const seen = new Set();
  return "<ul class=\"links\">" + edges.filter(e => { const k = e.kind + (dir === "out" ? e.to : e.from) + e.label; if (seen.has(k)) return false; seen.add(k); return true; })
    .map(e => {
      const other = dir === "out" ? e.to : e.from, o = S[other];
      const where = o.kind !== "external" && fileOf(o) && fileOf(o) !== fileOf(S[current]) ? ` <span class="elabel">${esc(fileOf(o).split("/").pop())}</span>` : "";
      const lab = ["thread", "http", "io", "serves"].includes(e.kind) && e.label ? ` <span class="elabel">${esc(e.label)}</span>` : "";
      const via = dir === "out" && e.from !== current ? ` <span class="elabel">fra ${esc(qual(e.from))}</span>` : dir === "in" && e.to !== current ? ` <span class="elabel">→ ${esc(qual(e.to))}</span>` : "";
      return `<li><span class="ek">${EDGE[e.kind] || e.kind}</span><span>${linkBtn(other)}${where}${lab}${via}</span></li>`;
    }).join("") + "</ul>";
}
function copyKey(btn, text) {
  const done = () => { btn.textContent = "Kopieret"; setTimeout(() => btn.textContent = "Kopiér nøgle", 1400); };
  try { navigator.clipboard.writeText(text).then(done, () => selectText(btn)); } catch (e) { selectText(btn); }
}
function selectText(btn) { const c = btn.previousElementSibling; const r = document.createRange(); r.selectNodeContents(c); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }

function render(id) {
  const s = S[id];
  if (!s || id === D.root) return renderOverview();
  const d = s.doc || {};
  const sub = subtree(id);
  const outE = [], inE = [];
  sub.forEach(x => { (OUT[x] || []).forEach(e => { if (!sub.has(e.to)) outE.push(e); }); (INC[x] || []).forEach(e => { if (!sub.has(e.from)) inE.push(e); }); });
  const cfgOut = outE.filter(e => e.kind === "config"), callOut = outE.filter(e => e.kind !== "config" && e.kind !== "import");
  const impOut = outE.filter(e => e.kind === "import"), impIn = inE.filter(e => e.kind === "import");
  const cfgIn = inE.filter(e => e.kind === "config"), callIn = inE.filter(e => e.kind !== "config" && e.kind !== "import");

  const badges = [];
  badges.push(`<span class="badge">${KIND[s.kind][1]}</span>`);
  if (s.thread) badges.push('<span class="badge thread">egen tråd (threading.Thread)</span>');
  if (s.route) badges.push(`<span class="badge route">${esc(s.route.methods.join(" | "))} ${esc(s.route.path)}</span>`);
  if (s.private) badges.push('<span class="badge">intern (starter med _)</span>');
  if (s.kind === "config" && s.unused) badges.push('<span class="badge warn">bruges ikke i koden endnu</span>');
  if (s.missing) badges.push('<span class="badge warn">mangler beskrivelse</span>');
  if (s.bases && s.bases.length) badges.push(`<span class="badge mono">arver ${esc(s.bases.join(", "))}</span>`);

  let h = `<div class="crumbs">${ancestors(id).map(a => `<button data-go="${a}">${esc(S[a].name || "/")}</button>`).join("<span>/</span>")}</div>`;
  h += `<div class="title-row">${tag(s.kind)}<h2>${esc(s.kind === "route" ? s.route.path : s.name)}</h2>${badges.join("")}</div>`;
  if (s.signature) h += `<div class="sig mono">${esc(s.signature)}</div>`;
  if (s.kind === "config") h += `<div class="sig mono">${esc(s.name)} = ${esc(s.value)}${s.comment ? "   # " + esc(s.comment) : ""}</div>`;
  if (summaryOf(s)) h += `<p class="summary">${esc(d.summary)}</p>`;
  else if (s.kind === "config" && s.comment) h += `<p class="summary">${esc(s.comment)}</p>`;
  else {
    const auto = [s.docstring, (s.comments || []).join(" "), s.inline_comment].filter(Boolean).join(" ");
    if (auto) h += `<p class="summary">${esc(auto)} <span class="elabel">(kommentar fra koden)</span></p>`;
  }
  if (s.missing) h += `<div class="missing"><span>Ingen forklaring endnu. Skriv den i <code>descriptions.json</code> under nøglen</span><code>${esc(s.key)}</code><button class="copy" data-copy="${esc(s.key)}">Kopiér nøgle</button></div>`;
  if (s.error) h += `<div class="note todo"><b>Kunne ikke læses</b>${esc(s.error)}</div>`;

  // modtager / sender
  let params = s.params, recvTitle = "Modtager";
  if (s.kind === "class") {
    const init = (s.children || []).find(c => S[c].name === "__init__");
    if (init) { params = S[init].params; recvTitle = "Modtager ved oprettelse"; }
  }
  const pdoc = (s.kind === "class" ? ((S[(s.children || []).find(c => S[c].name === "__init__")] || {}).doc || {}).params : d.params) || {};
  if (params || d.receives || s.returns || d.returns || d.sends) {
    let recv = "";
    if (params && params.length) recv += `<table class="params">${params.map(p => `<tr><td>${esc(p.name)}${p.default ? `<span class="def">= ${esc(p.default)}</span>` : ""}</td><td>${esc(pdoc[p.name] || "")}</td></tr>`).join("")}</table>`;
    else if (params) recv += '<p class="empty">Ingen argumenter.</p>';
    if (d.receives) recv += `<p>${esc(d.receives)}</p>`;
    let send = "";
    if (d.sends) send += `<p>${esc(d.sends)}</p>`;
    if (s.returns && s.returns.length) send += `<div class="ret">${s.returns.map(r => `<code>return ${esc(r)}</code>`).join("")}</div>`;
    if (d.returns) send += `<p>${esc(d.returns)}</p>`;
    if (!send) send = s.kind === "class" ? '<p class="empty">Se metoderne nedenfor.</p>' : '<p class="empty">Returnerer intet.</p>';
    h += `<div class="cols"><div class="box"><h3>${recvTitle}</h3>${recv || '<p class="empty">Ingen argumenter.</p>'}</div><div class="box"><h3>Sender / returnerer</h3>${send}</div></div>`;

  }

  const exts = [...new Set([...sub].flatMap(x => S[x].externals || []))];
  if (exts.length) extra.push(`<div class="box"><h3>Biblioteker og eksterne kald</h3><div class="chips">${exts.map(x => `<code>${esc(x)}</code>`).join("")}</div></div>`);
  if (s.kind === "file" && (impOut.length || impIn.length)) extra.push(`<div class="box"><h3>Imports</h3>${impOut.length ? `<p class="elabel">importerer fra</p>${edgeList(impOut, "out")}` : ""}${impIn.length ? `<p class="elabel">importeres af</p>${edgeList(impIn, "in")}` : ""}</div>`);

  if (d.notes) h += `<div class="note"><b>Bemærk</b>${esc(d.notes)}</div>`;
  if (d.todo && d.todo.length) h += `<div class="note todo"><b>Mangler i koden</b><ul>${d.todo.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`;

  const kids = sortedChildren(s);
  if (kids.length) {
    const title = { folder: "Indhold", file: "I filen", class: "Metoder", method: "Indlejrede funktioner" }[s.kind] || "Indhold";
    h += `<div class="box"><h3>${title}</h3><div class="members">${kids.map(c => `<button data-go="${c}">${tag(S[c].kind)}<span class="m-n">${esc(S[c].kind === "route" ? S[c].route.path : S[c].name)}</span><span class="m-s">${esc(summaryOf(S[c]) || (S[c].kind === "config" ? S[c].value : "") || (S[c].kind === "file" ? fmtSize(S[c].size) : ""))}</span></button>`).join("")}</div></div>`;

}

    h += `<div class="cols">`;
    if (miss.length) h += `<div class="box"><h3>Mangler beskrivelse</h3><ul class="links">${miss.map(id => `<li><span class="ek">${KIND[S[id].kind][1]}</span><span>${linkBtn(id)}</span></li>`).join("")}</ul></div>`;
    if (stale.length) h += `<div class="box"><h3>Beskrivelser uden kode</h3><p class="elabel">Koden er slettet eller omdøbt. Ret eller fjern nøglen i descriptions.json.</p><div class="chips">${stale.map(k => `<code>${esc(k)}</code>`).join("")}</div></div>`;
    h += `</div>`;
  }
  $("#detail").innerHTML = h;
}

$("#detail").addEventListener("click", e => {
  const c = e.target.closest("[data-copy]"); if (c) { copyKey(c, c.dataset.copy); return; }
  const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go);
});

/* ---------- navigation ---------- */
function go(id) { if (location.hash.slice(1) === id) select(id); else location.hash = id; }
function select(id) {
  current = S[id] && id !== D.root ? id : null;
  if (current) ancestors(current).forEach(a => open.add(a));
  renderTree(); drawMap(); render(current || D.root);
  const row = document.querySelector(`.row[data-id="${current}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
}
window.addEventListener("hashchange", () => select(location.hash.slice(1)));
$("#home").addEventListener("click", () => { history.replaceState(null, "", location.pathname + location.search); select(null); });
$("#q").addEventListener("input", e => { query = e.target.value.trim(); renderTree(); });
$("#f-missing").addEventListener("click", e => { filterMissing = !filterMissing; e.target.setAttribute("aria-pressed", filterMissing); renderTree(); });
$("#f-expand").addEventListener("click", e => {
  const all = Object.values(S).filter(s => s.children && s.children.length && s.kind !== "external");
  const allOpen = all.every(s => open.has(s.id));
  all.forEach(s => allOpen ? open.delete(s.id) : open.add(s.id));
  if (allOpen) open.add(D.root);
  e.target.textContent = allOpen ? "Fold alt ud" : "Fold sammen";
  renderTree();
});

/* ---------- start ---------- */
$("#repo-name").textContent = D.meta.repo_name;
const fmtDate = s => { try { return new Date(s).toLocaleString("da-DK", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return s; } };
$("#meta").innerHTML = (D.meta.commit ? `commit <code>${esc(D.meta.commit.slice(0, 7))}</code> · ${esc(fmtDate(D.meta.commit_date))}` : "") + ` · bygget ${esc(fmtDate(D.meta.built))}`
  + (D.meta.web ? ` · <a href="${esc(D.meta.web)}" target="_blank" rel="noopener">GitHub ↗</a>` : "");
$("#show-life").checked = load("cx-life") === "1";
open.add(D.root);
Object.values(S).forEach(s => { if (s.kind === "folder") open.add(s.id); });
select(location.hash.slice(1));
</script>

</body></html>
