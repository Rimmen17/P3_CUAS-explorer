name: Byg Code Explorer

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # hver nat kl. 03 UTC: henter nyeste P3_CUAS-kode
  workflow_dispatch:       # knappen "Run workflow" under Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byg siden
        run: |
          mkdir -p site
          python build_explorer.py --out site/index.html
      - name: Advarsel om manglende beskrivelser
        run: python build_explorer.py --out site/index.html --check || echo "::warning::Nogle funktioner mangler beskrivelse i descriptions.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
