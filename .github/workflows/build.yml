name: Udgiv Code Explorer

# Udgiver site/index.html på GitHub Pages ved hvert push.
# Hvis secret'en P3_CUAS_TOKEN findes (token med læseadgang til det private P3_CUAS),
# bygges siden også igen her fra den nyeste kode, også hver nat.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byg siden fra nyeste P3_CUAS-kode (kun med token)
        env:
          P3_CUAS_TOKEN: ${{ secrets.P3_CUAS_TOKEN }}
        run: |
          if [ -n "$P3_CUAS_TOKEN" ]; then
            python build_explorer.py --out site/index.html
          else
            echo "Ingen P3_CUAS_TOKEN: udgiver den committede site/index.html"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
